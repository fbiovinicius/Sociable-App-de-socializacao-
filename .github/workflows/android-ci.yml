name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, testes e lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permissão ao wrapper
        run: chmod +x gradlew

      # A MAPS_API_KEY fica em local.properties (fora do Git). Sem a chave o app
      # compila normalmente; apenas o mapa não carrega. Em CI não há segredo.
      - name: Build, testes unitários e lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --console=plain

      - name: Salvar relatórios (testes e lint)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.sarif
          if-no-files-found: ignore

      - name: Salvar APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: sociable-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
